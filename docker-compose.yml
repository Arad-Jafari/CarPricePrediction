x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deployment}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AI_ENABLED: ${AI_ENABLED:-true}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:1b}
  AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-2048}
  AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-8}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
  AI_ENABLE_RAG: ${AI_ENABLE_RAG:-false}
  AI_ENABLE_TOOLS: ${AI_ENABLE_TOOLS:-true}
  AI_STORAGE_PATH: /app/local_data
  AI_VECTOR_DB_PATH: /app/local_data/chroma
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-carprice}
  POSTGRES_USER: ${POSTGRES_USER:-carprice}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only-change-before-deployment}
  MODEL_PATH: /app/ml/artifacts/CarPredictionModel.pkl
  PREPROCESSOR_PATH: /app/ml/artifacts/CarPreprocessor.pkl
  CHAT_PROVIDER: ${CHAT_PROVIDER:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carprice}
      POSTGRES_USER: ${POSTGRES_USER:-carprice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only-change-before-deployment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    volumes:
      - assistant_data:/app/local_data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  assistant_data:
  ollama_data:
